name: gitleaks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: Secret and PII scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The OSS CLI, not gitleaks-action: organization repos need a paid
      # gitleaks-action license, and this job only has to fail the build.
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the tree at this commit
        run: bash tools/scan-secrets.sh
