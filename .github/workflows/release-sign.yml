name: Sign release
# Builds SHA256SUMS for every release asset from GitHub's server-side asset digests,
# signs it with Sigstore cosign (keyless, GitHub OIDC), and publishes SLSA build
# provenance for it. Verify with docs/VERIFYING.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)sign
        required: true
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # upload signature assets
      id-token: write        # Sigstore keyless signing
      attestations: write    # build provenance
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: SHA256SUMS from release asset digests
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | test("^(SHA256SUMS|.*\\.(sig|pem|bundle|intoto\\.jsonl))$") | not) | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
            > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign sign-blob (keyless)
        run: cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SHA256SUMS
      - name: Upload signature assets
        run: gh release upload "$TAG" SHA256SUMS SHA256SUMS.cosign.bundle --clobber --repo "$GITHUB_REPOSITORY"
