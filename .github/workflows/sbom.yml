name: SBOM
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sbom:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # attach SBOMs to releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SPDX SBOM of the source tree
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: zoth-studio-source.spdx.json
          upload-artifact: true
          upload-release-assets: ${{ github.event_name == 'release' }}
      - name: CycloneDX SBOM of the source tree
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: zoth-studio-source.cdx.json
          upload-artifact: true
          upload-release-assets: ${{ github.event_name == 'release' }}
